spring.application.name=mujiza
server.port=8081
server.forward-headers-strategy=native
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.tomcat.threads.min-spare=8
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:1000}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mujiza_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000
# N+1 muammosiga qarshi: bog'langan ma'lumotlarni 50 tadan guruhlab yuklash
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Ommaviy INSERT va UPDATE so'rovlarini 50 tadan guruhlab tezkor yozish (bulk write batching)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false

spring.flyway.enabled=true

# Fayllar qayerda saqlanishi: "local" (server diski) yoki "s3" (Cloudflare R2 / AWS S3)
app.storage.type=${STORAGE_TYPE:local}
# Local rejimda rasmlar saqlanadigan papka
app.storage.local.path=${STORAGE_LOCAL_PATH:./uploads}
# S3 / Cloudflare R2 bulutli xotira sozlamalari (chiqish trafigi $0, 30 kunlik tezkor CDN kesh)
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.region=${S3_REGION:auto}
app.storage.s3.bucket=${S3_BUCKET:mujiza-media}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.s3.public-url=${S3_PUBLIC_URL:}

# Bitta fayl hajmi 5 MB dan oshmasin, butun so'rov 6 MB dan oshmasin
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=1MB

# JWT tokenni imzolash uchun maxfiy kalit (kamida 32 belgi). Faylga yozilmaydi, environment o'zgaruvchisidan olinadi.
# Ham JWT_SECRET, ham standart Spring relaxed binding (APP_JWT_SECRET) qo'llab-quvvatlanadi
app.jwt.secret=${JWT_SECRET:${APP_JWT_SECRET:}}
# Token necha soat amal qiladi (shundan keyin admin qayta kirishi kerak)
app.jwt.expiration-hours=12

# JWT cookie'ning nomi va faqat HTTPS orqali yuborilishi (lokalda false, jonli serverda true qilamiz)
app.jwt.cookie-name=MUJIZA_TOKEN
app.jwt.cookie-secure=${COOKIE_SECURE:false}

# Birinchi adminni yaratish uchun ma'lumotlar
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:Administrator}
# Admin panel (frontend) qaysi manzildan so'rov yuborishi mumkin. Bir nechta bo'lsa vergul bilan ajratiladi.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Bazaga vaqt yozish va o'qishda ham Toshkent vaqt zonasi ishlatiladi
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tashkent
# Saytning ochiq manzili (Telegram xabaridagi rasm havolalari uchun). Oxirida "/" bo'lmasin.
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}

# Telegram bildirishnomalarini yoqish (false bo'lsa hech qanday xabar yuborilmaydi)
app.telegram.enabled=true
# Bot tokeni va xabar boradigan chat id
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.admin-chat-id=${TELEGRAM_CHAT_ID:}
# Telegram WebApp (Mini App) ochiladigan manzil
app.telegram.webapp-url=${TELEGRAM_WEBAPP_URL:https://mujiza.uz}
# Guruh chatida (manfiy chat id) tugma bosishi mumkin bo'lgan user id lar, vergul bilan.
# Shaxsiy chatda bo'sh qoldiriladi. Bo'sh qiymat Tomcat yoki xabar yuborishni o'zgartirmaydi.
app.telegram.allowed-user-ids=${TELEGRAM_ALLOWED_USER_IDS:}

# Ochiq health: faqat UP yoki DOWN. Baza nomi va boshqa actuator yo'llari yopiq.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Rejalashtirilgan vazifalar uchun 2 ta oqim: Telegram'ni so'rash sekin bo'lsa ham, buyurtma kuzatuv sahifalarining "tirikman" belgilari kechikmasligi uchun
spring.task.scheduling.pool.size=2
