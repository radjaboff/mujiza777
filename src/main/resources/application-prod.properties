# Production must be started with SPRING_PROFILES_ACTIVE=prod.
app.jwt.cookie-secure=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.jpa.show-sql=false
server.forward-headers-strategy=native
# Trust X-Forwarded-For only from private-network proxies (Tomcat's default).
# If the reverse proxy is outside those ranges, set server.tomcat.remoteip.internal-proxies.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
