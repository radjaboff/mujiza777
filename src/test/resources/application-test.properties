# Context tests must not use the developer machine's Postgres password.
# Schema comes from the entities. Production still uses Flyway on PostgreSQL.
spring.datasource.url=jdbc:h2:mem:mujiza;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.jwt.secret=test-jwt-secret-must-be-at-least-32-bytes
app.admin.username=
app.admin.password=
app.telegram.enabled=false
