<svg width="280" height="280" viewBox="0 0 280 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="greenGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#36663E" />
      <stop offset="70%" stop-color="#244B2B" />
      <stop offset="100%" stop-color="#1A3820" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <pattern id="islamicPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M6 0 L12 6 L6 12 L0 6 Z" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" />
      <circle cx="6" cy="6" r="1.5" fill="rgba(255,255,255,0.4)" />
    </pattern>
  </defs>

  <!-- Tashqi yoritgich (Do'kondagi LED neon glow) -->
  <circle cx="140" cy="140" r="132" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85" />
  <circle cx="140" cy="140" r="126" fill="url(#greenGlow)" />
  
  <!-- Ichki oltin hoshiya -->
  <circle cx="140" cy="140" r="121" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.6" />

  <!-- 777 yozuvi -->
  <g transform="translate(140, 96)" text-anchor="middle">
    <text x="-25" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-style="italic" font-size="30" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-style="italic" font-size="35" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="25" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-style="italic" font-size="30" fill="#FFFFFF" text-anchor="middle">7</text>
  </g>

  <!-- Chapdagi naqsh tasmasi -->
  <rect x="22" y="134" width="34" height="12" fill="url(#islamicPattern)" rx="2" />
  <!-- O'ngdagi naqsh tasmasi -->
  <rect x="224" y="134" width="34" height="12" fill="url(#islamicPattern)" rx="2" />

  <!-- MO'JIZA yozuvi -->
  <text x="140" y="148" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="37" fill="#FFFFFF" letter-spacing="3">
    MO<tspan fill="#D4AF37">'</tspan>JIZA
  </text>

  <!-- shirinliklari yozuvi -->
  <text x="140" y="179" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="18" fill="url(#goldGrad)" letter-spacing="5">
    shirinliklari
  </text>
</svg>
