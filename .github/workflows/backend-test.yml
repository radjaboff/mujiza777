name: Build and test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mujiza_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mujiza_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PASSWORD: ci-db-password
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-bytes
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B test

      # Exercise production Flyway migrations and the PostgreSQL advisory-lock SQL.
      - name: Prepare restricted PostgreSQL app role
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          PGPASSWORD=ci-db-password psql -h localhost -U postgres -d mujiza_db -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ci_app LOGIN PASSWORD 'ci-app-password'" \
            -c "ALTER DATABASE mujiza_db OWNER TO ci_app"

      - name: PostgreSQL production smoke test
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:postgresql://localhost:5432/mujiza_db
          DB_USERNAME: ci_app
          DB_PASSWORD: ci-app-password
          JWT_SECRET: ci-jwt-secret-must-be-at-least-32-bytes
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-admin-password
          CORS_ALLOWED_ORIGINS: https://example.test
          PUBLIC_BASE_URL: https://example.test
          STORAGE_TYPE: local
        run: ./mvnw -B -Dtest=PostgresDeploymentSmokeIT test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          API_INTERNAL_URL: http://127.0.0.1:8081
          NEXT_PUBLIC_SITE_URL: https://example.test
